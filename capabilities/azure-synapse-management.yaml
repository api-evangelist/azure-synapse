naftiko: 1.0.0-alpha2
info:
  label: Azure Synapse Analytics Management
  description: Workflow capability for managing Azure Synapse Analytics resources. Used by cloud engineers and DevOps teams.
  tags:
  - Azure
  - Cloud
  - Management
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AZURE_SUBSCRIPTION_ID: AZURE_SUBSCRIPTION_ID
    AZURE_ACCESS_TOKEN: AZURE_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: azure-synapse
    baseUri: https://management.azure.com
    description: Azure Synapse Analytics REST API
    authentication:
      type: bearer
      token: '{{AZURE_ACCESS_TOKEN}}'
    resources:
    - name: workspace
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Workspace/Workspaces
      description: Manage Workspace resources
      operations:
      - name: list-workspaces
        method: GET
        description: List all Workspace resources
        inputParameters:
        - name: subscriptionId
          in: path
          type: string
          required: true
          description: Azure subscription ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sql-pool
      path: /subscriptions/{subscriptionId}/providers/Microsoft.SqlPool/SqlPools
      description: Manage SqlPool resources
      operations:
      - name: list-sql-pools
        method: GET
        description: List all SqlPool resources
        inputParameters:
        - name: subscriptionId
          in: path
          type: string
          required: true
          description: Azure subscription ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: big-data-pool
      path: /subscriptions/{subscriptionId}/providers/Microsoft.BigDataPool/BigDataPools
      description: Manage BigDataPool resources
      operations:
      - name: list-big-data-pools
        method: GET
        description: List all BigDataPool resources
        inputParameters:
        - name: subscriptionId
          in: path
          type: string
          required: true
          description: Azure subscription ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: pipeline
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Pipeline/Pipelines
      description: Manage Pipeline resources
      operations:
      - name: list-pipelines
        method: GET
        description: List all Pipeline resources
        inputParameters:
        - name: subscriptionId
          in: path
          type: string
          required: true
          description: Azure subscription ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8081
    namespace: azure-synapse-management-api
    description: Unified REST API for Azure Synapse Analytics management.
    resources:
    - path: /v1/resources
      name: resources
      description: Resource management
      operations:
      - method: GET
        name: list
        description: List all resources
        call: azure-synapse.list-workspaces
        with:
          subscriptionId: rest.subscriptionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9091
    namespace: azure-synapse-management-mcp
    transport: http
    description: MCP server for AI-assisted Azure Synapse Analytics management.
    tools:
    - name: list-workspaces
      description: List Workspace resources
      hints:
        readOnly: true
        openWorld: true
      call: azure-synapse.list-workspaces
      with:
        subscriptionId: tools.subscriptionId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-sql-pools
      description: List SqlPool resources
      hints:
        readOnly: true
        openWorld: true
      call: azure-synapse.list-sql-pools
      with:
        subscriptionId: tools.subscriptionId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-big-data-pools
      description: List BigDataPool resources
      hints:
        readOnly: true
        openWorld: true
      call: azure-synapse.list-big-data-pools
      with:
        subscriptionId: tools.subscriptionId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-pipelines
      description: List Pipeline resources
      hints:
        readOnly: true
        openWorld: true
      call: azure-synapse.list-pipelines
      with:
        subscriptionId: tools.subscriptionId
      outputParameters:
      - type: object
        mapping: $.
