naftiko: "1.0.0-alpha1"

info:
  label: "Azure Synapse Analytics"
  description: "Azure Synapse Analytics REST API for Azure resource management."
  tags:
    - Azure
    - Cloud
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AZURE_SUBSCRIPTION_ID: AZURE_SUBSCRIPTION_ID
      AZURE_ACCESS_TOKEN: AZURE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: azure-synapse
      baseUri: https://management.azure.com
      description: "Azure Synapse Analytics REST API"
      authentication:
        type: bearer
        token: "{{AZURE_ACCESS_TOKEN}}"
      resources:
        - name: workspace
          path: /subscriptions/{subscriptionId}/providers/Microsoft.Workspace/Workspaces
          description: "Manage Workspace resources"
          operations:
            - name: list-workspaces
              method: GET
              description: "List all Workspace resources"
              inputParameters:
                - name: subscriptionId
                  in: path
                  type: string
                  required: true
                  description: "Azure subscription ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: sql-pool
          path: /subscriptions/{subscriptionId}/providers/Microsoft.SqlPool/SqlPools
          description: "Manage SqlPool resources"
          operations:
            - name: list-sql-pools
              method: GET
              description: "List all SqlPool resources"
              inputParameters:
                - name: subscriptionId
                  in: path
                  type: string
                  required: true
                  description: "Azure subscription ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: big-data-pool
          path: /subscriptions/{subscriptionId}/providers/Microsoft.BigDataPool/BigDataPools
          description: "Manage BigDataPool resources"
          operations:
            - name: list-big-data-pools
              method: GET
              description: "List all BigDataPool resources"
              inputParameters:
                - name: subscriptionId
                  in: path
                  type: string
                  required: true
                  description: "Azure subscription ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: pipeline
          path: /subscriptions/{subscriptionId}/providers/Microsoft.Pipeline/Pipelines
          description: "Manage Pipeline resources"
          operations:
            - name: list-pipelines
              method: GET
              description: "List all Pipeline resources"
              inputParameters:
                - name: subscriptionId
                  in: path
                  type: string
                  required: true
                  description: "Azure subscription ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8141
      namespace: azure-synapse-api
      resources:
        - path: /v1/resources
          name: resources
          description: "Resource management"
          operations:
            - method: GET
              name: list-resources
              description: "List resources"
              call: "azure-synapse.list-workspaces"
              with:
                subscriptionId: "rest.subscriptionId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9141
      namespace: azure-synapse-mcp
      transport: http
      tools:
        - name: list-workspaces
          description: "List Workspace resources in Azure"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-synapse.list-workspaces"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-sql-pools
          description: "List SqlPool resources in Azure"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-synapse.list-sql-pools"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-big-data-pools
          description: "List BigDataPool resources in Azure"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-synapse.list-big-data-pools"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-pipelines
          description: "List Pipeline resources in Azure"
          hints:
            readOnly: true
            openWorld: true
          call: "azure-synapse.list-pipelines"
          with:
            subscriptionId: "tools.subscriptionId"
          outputParameters:
            - type: object
              mapping: "$."
